<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Portfolio of Jojo Jose, a Computer Science graduate & M.S. Cybersecurity student specializing in Software Development, Data Analysis, and AI Robotics (ROS 2)." />
    <title>Jojo Jose | Portfolio</title>
    
    <!-- Google Fonts: Space Grotesk & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Anti-Flash Blocking Theme Script (Runs synchronously before first paint) -->
    <style>
      html, body {
        background-color: #e2e5ea;
        color: #18181b;
      }
      html.dark, html.dark body {
        background-color: #0d0e13;
        color: #f4f4f5;
      }
    </style>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0d0e13';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#e2e5ea';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
